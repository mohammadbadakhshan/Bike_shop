<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>پنل مدیریت فروشگاه BIKE SHOP</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: Tahoma, Arial, sans-serif;
      background: #f2f4f7;
      color: #222;
    }
    .header {
      background: #101827;
      color: white;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .card {
      background: white;
      padding: 22px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 10px #0000000c;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 8px 0 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 18px;
      margin: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
    }
    .primary { background: #1769aa; color: white; }
    .danger { background: #d93636; color: white; }
    .gray { background: #687386; color: white; }
    .product {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin: 12px 0;
      background: white;
    }
    .product img {
      width: 110px;
      height: 100px;
      object-fit: contain;
      display: block;
      margin-bottom: 10px;
    }
    .hidden { display: none !important; }
    #status, #loginStatus {
      margin-top: 12px;
      line-height: 2;
      color: #b42318;
      overflow-wrap: anywhere;
    }
    label { font-weight: bold; }
  </style>
</head>

<body>

  <div class="header">
    <h2>پنل مدیریت فروشگاه BIKE SHOP</h2>
    <p>مدیریت محصولات فروشگاه</p>
  </div>

  <section class="card" id="loginBox">
    <h3>ورود مدیر</h3>

    <label>ایمیل مدیر</label>
    <input id="email" type="email" placeholder="ایمیل حساب مدیر">

    <label>رمز عبور</label>
    <input id="password" type="password" placeholder="رمز عبور">

    <button class="primary" id="loginBtn" onclick="login()">ورود به پنل</button>
    <p id="loginStatus"></p>
  </section>

  <section id="adminPanel" class="hidden">

    <div class="card">
      <button class="gray" onclick="logout()">خروج از حساب</button>
      <h3 id="formTitle">افزودن محصول جدید</h3>

      <form id="productForm">
        <label>نام محصول</label>
        <input id="name" type="text" required placeholder="نام محصول">

        <label>قیمت (تومان)</label>
        <input id="price" type="number" min="0" required placeholder="قیمت">

        <label>تعداد موجودی</label>
        <input id="quantity" type="number" min="0" required value="0">

        <label>توضیحات محصول</label>
        <textarea id="description" rows="4" placeholder="توضیحات محصول"></textarea>

        <label>عکس محصول</label>
        <input id="photo" type="file" accept="image/*">

        <button class="primary" type="submit" id="saveBtn">ذخیره محصول</button>
        <button class="gray hidden" type="button" id="cancelBtn" onclick="cancelEdit()">لغو ویرایش</button>
      </form>

      <p id="status"></p>
    </div>

    <div class="card">
      <h3>محصولات فروشگاه</h3>
      <button class="primary" onclick="loadProducts()">به‌روزرسانی فهرست</button>
      <div id="productsList">در حال بارگذاری...</div>
    </div>

  </section>

<script>
  const SUPABASE_URL = "https://kumtiwfvoavuygevhrjy.supabase.co";
  const SUPABASE_KEY = "sb_publishable_pA8mhx3UvQUpmhpZ5MLp4w_In0eipwE";

  const ADMIN_UID = "320c43f8-2f9b-4ee2-9779-cde175326012";
  const BUCKET = "product-images";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  let editingId = null;
  let oldImageUrl = "";

  function el(id) {
    return document.getElementById(id);
  }function showMessage(message, isError = false) {
    el("status").style.color = isError ? "#b42318" : "#16803c";
    el("status").textContent = message;
  }
  async function login() {
    const email = el("email").value.trim();
    const password = el("password").value;

    if (!email || !password) {
      el("loginStatus").textContent = "ایمیل و رمز عبور را وارد کن.";
      return;
    }

    el("loginBtn").disabled = true;
    el("loginStatus").textContent = "در حال ورود...";

    const { data, error } = await db.auth.signInWithPassword({
      email: email,
      password: password
    });

    el("loginBtn").disabled = false;

    if (error) {
      el("loginStatus").textContent = "خطا در ورود: " + error.message;
      return;
    }

    if (data.user.id !== ADMIN_UID) {
      await db.auth.signOut();
      el("loginStatus").textContent = "این حساب اجازه ورود به پنل مدیریت را ندارد.";
      return;
    }

    el("loginStatus").textContent = "";
    showAdmin();
  }

  function showAdmin() {
    el("loginBox").classList.add("hidden");
    el("adminPanel").classList.remove("hidden");
    loadProducts();
  }

  async function logout() {
    await db.auth.signOut();
    el("adminPanel").classList.add("hidden");
    el("loginBox").classList.remove("hidden");
    el("password").value = "";
    el("loginStatus").textContent = "از حساب خارج شدی.";
  }

  async function checkSession() {
    const { data } = await db.auth.getSession();

    if (data.session && data.session.user.id === ADMIN_UID) {
      showAdmin();
    } else {
      if (data.session) await db.auth.signOut();
      el("loginBox").classList.remove("hidden");
      el("adminPanel").classList.add("hidden");
    }
  }

  async function loadProducts() {
    el("productsList").textContent = "در حال بارگذاری محصولات...";

    const { data, error } = await db
      .from("products")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      el("productsList").textContent = "خطا در دریافت محصولات: " + error.message;
      return;
    }

    el("productsList").innerHTML = "";

    if (!data || data.length === 0) {
      el("productsList").textContent = "هنوز محصولی ثبت نشده است.";
      return;
    }

    data.forEach(product => {
      const item = document.createElement("div");
      item.className = "product";

      const image = product["image-url"] || "";

      item.innerHTML =`
        ${image ? <img src="${escapeHTML(image)}" alt="عکس محصول"> : ""}
        <h3>${escapeHTML(product.name || "")}</h3>
        <p>قیمت: ${Number(product.price || 0).toLocaleString("fa-IR")} تومان</p>
        <p>موجودی: ${Number(product.quantity || 0).toLocaleString("fa-IR")}</p>
        <p>${escapeHTML(product.description || "")}</p>
        <button class="primary" data-action="edit" data-id="${escapeHTML(product.id)}">ویرایش</button>
        <button class="danger" data-action="delete" data-id="${escapeHTML(product.id)}">حذف</button>
      `;

      el("productsList").appendChild(item);
    });
  }

  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, function(char) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char];
    });
  }

  async function uploadImage(file) {
    const extension = file.name.split(".").pop().toLowerCase();
    const filePath = Date.now() + "-" + Math.random().toString(36).slice(2) + "." + extension;

    const { error } = await db.storage
      .from(BUCKET)
      .upload(filePath, file, {
        cacheControl: "3600",
        upsert: false
      });

    if (error) throw error;

    const { data } = db.storage
      .from(BUCKET)
      .getPublicUrl(filePath);

    return data.publicUrl;
  }

  el("productForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const saveBtn = el("saveBtn");
    saveBtn.disabled = true;
    showMessage("در حال ذخیره محصول...");try {
      const name = el("name").value.trim();
      const price = Number(el("price").value);
      const quantity = Number(el("quantity").value);
      const description = el("description").value.trim();
      const file = el("photo").files[0];

      if (!name  !Number.isFinite(price)  price < 0 ||
          !Number.isInteger(quantity) || quantity < 0) {
        throw new Error("نام، قیمت و تعداد موجودی را درست وارد کن.");
      }

      let imageUrl = oldImageUrl;

      if (file) {
        imageUrl = await uploadImage(file);
      }

      const productData = {
        name: name,
        price: price,
        quantity: quantity,
        description: description,
        "image-url": imageUrl
      };

      let result;

      if (editingId) {
        result = await db
          .from("products")
          .update(productData)
          .eq("id", editingId);
      } else {
        result = await db
          .from("products")
          .insert([productData]);
      }

      if (result.error) throw result.error;

      showMessage(editingId ? "محصول ویرایش شد." : "محصول با موفقیت اضافه شد.");

      clearForm();
      await loadProducts();

    } catch (error) {
      showMessage("خطا: " + error.message, true);
    }

    saveBtn.disabled = false;
  });

  async function editProduct(id) {
    const { data, error } = await db
      .from("products")
      .select("*")
      .eq("id", id)
      .single();

    if (error) {
      showMessage("خطا در دریافت محصول: " + error.message, true);
      return;
    }

    editingId = id;
    oldImageUrl = data["image-url"] || "";

    el("name").value = data.name || "";
    el("price").value = data.price || 0;
    el("quantity").value = data.quantity || 0;
    el("description").value = data.description || "";
    el("photo").value = "";

    el("formTitle").textContent = "ویرایش محصول";
    el("saveBtn").textContent = "ذخیره تغییرات";
    el("cancelBtn").classList.remove("hidden");

    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  async function deleteProduct(id) {
    if (!confirm("آیا از حذف این محصول مطمئنی؟")) return;

    const { error } = await db
      .from("products")
      .delete()
      .eq("id", id);

    if (error) {
      showMessage("خطا در حذف محصول: " + error.message, true);
      return;
    }

    showMessage("محصول حذف شد.");
    await loadProducts();
  }

  function clearForm() {
    el("productForm").reset();
    editingId = null;
    oldImageUrl = "";
    el("formTitle").textContent = "افزودن محصول جدید";
    el("saveBtn").textContent = "ذخیره محصول";
    el("cancelBtn").classList.add("hidden");
  }

  function cancelEdit() {
    clearForm();
    showMessage("ویرایش لغو شد.");
  }

  el("productsList").addEventListener("click", function(event) {
    const button = event.target.closest("button[data-action]");
    if (!button) return;

    const id = button.dataset.id;

    if (button.dataset.action === "edit") {
      editProduct(id);
    } else if (button.dataset.action === "delete") {
      deleteProduct(id);
    }
  });

  checkSession();

  db.auth.onAuthStateChange((event, session) => {
    if (event === "SIGNED_OUT") {
      el("adminPanel").classList.add("hidden");
      el("loginBox").classList.remove("hidden");
    }
  });window.login = login;
</script>

</body>
</html>
